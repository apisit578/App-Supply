sonar {
    properties {
        def targetFlavor = project.findProperty("targetFlavor")
        def formattedFlavor = targetFlavor[0].toLowerCase() + targetFlavor[1..-1]

        property "sonar.projectKey", "SAGE-${targetFlavor.toLowerCase()}"
        property "sonar.projectName", "SAGE-${targetFlavor.toLowerCase()}"

		property "sonar.sourceEncoding", "UTF-8"
        property "sonar.sources", "src/main/java"
        property "sonar.binaries", "build/intermediates/app_classes/${formattedFlavor}"
        property "sonar.java.binaries", "build/intermediates/javac/${formattedFlavor}"
        property "sonar.java.source", "1.8"

        // Analyze tests classes
//        if (project.plugins.hasPlugin('com.android.application')) {
//            property "sonar.tests", "src/test/java, src/androidTest/java"
//        } else {
            property "sonar.tests", "src/test/java"
//        }

        property "sonar.java.test.binaries", "build/tmp/kotlin-classes/${formattedFlavor}UnitTest"
        property "sonar.coverage.jacoco.xmlReportPaths", "${rootProject.projectDir}/app/build/reports/kover/report${targetFlavor}.xml"
        property "sonar.java.coveragePlugin", "kover"
        property "sonar.junit.reportsPath", "build/test-results/test${targetFlavor}UnitTest"
        property "sonar.android.lint.report", "build/reports/lint-results.xml"
        property "sonar.exclusions",
                "**/R.class, **/R.class, **/R\$*.class, **/BuildConfig.*, **/Manifest*.*, **/*Fragment*.*, **/*manager/*, **/*activity/***, **/*network/**, **/*Api/**, **/di/**, **/*_Factory*, **/*_Provide*Factory*, **/*Test*, **/model/**, **/*callback/**/*, **/*state/**/*, **/ui/**, **/utils/**, **/constants/**"
    }
}